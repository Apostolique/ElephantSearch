name: Build and test

on:
  push:
    branches:
    - 'main'
  pull_request:

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0
    - name: Test
      run: zig build test --summary all
    - name: Build
      run: zig build -Dtarget=x86_64-windows
